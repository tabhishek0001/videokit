name: Validate VideoKit
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check required files
        run: |
          test -s index.html
          test -s assets/css/app.css
          test -s assets/js/app.js
          test -s PRODUCT-SPEC.md
          test -s tests/TEST-PLAN.md
